# FocusiQ on Netlify (site: focus-iq). These settings override the Netlify UI.
# The app is two static pages: Directors (index.html) and employees (employee.html).
[build]
  command = "npm run build:app"
  publish = "app/dist"

[build.environment]
  NODE_VERSION = "22"
  # Live mode (docs/going-live.md). Both values are public by design: the
  # publishable key is meant to be in the browser, and row-level security
  # decides what anyone can see. Tell Netlify's secrets scan not to block them.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
